name = "simorgh-edge-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[ai]
binding = "AI"
remote = true

[[kv_namespaces]]
binding = "CONTEXT_STORE"
id = "984ba26b093b4c5a8a1661ac36831c1b"

[[durable_objects.bindings]]
name = "FLOCK_COORDINATOR"
class_name = "FlockCoordinator"

[[durable_objects.bindings]]
name = "DATA_TRUST_VAULT"
class_name = "DataTrustVault"

# ── Durable Object migrations ────────────────────────────
# v1 creates both classes as SQLite-backed Durable Objects (both use
# `this.state.storage.sql`). v2 is an empty tag bump — see docs/DEPLOY.md §C.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlockCoordinator", "DataTrustVault"]

[[migrations]]
tag = "v2"

[triggers]
crons = ["15 6 * * *"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
CORS_ORIGINS = "https://simorgh-edge-gateway.shahino3ozone1353.workers.dev"

# Secrets must never be committed:
# npx wrangler secret put SIMORGH_API_KEY
# npx wrangler secret put GROQ_API_KEY
# npx wrangler secret put HF_TOKEN
# npx wrangler secret put TELEGRAM_BOT_TOKEN
# npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
#
# Optional provider keys. Each one is the *only* thing that activates its bird: without
# it the provider reports itself `dormant` on /api/v1/flock/status and is skipped
# without a cooldown, so a zero-key deployment still answers via Homā (Workers AI).
# npx wrangler secret put GEMINI_API_KEY
# npx wrangler secret put OPENROUTER_API_KEY
#
# Browser origins are non-secret and should be set per deployment:
# CORS_ORIGINS = "https://your-vercel-dashboard.example"
