[package]
name = "simorgh-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Simorgh native acceleration modules: the model-output shield, ported faithfully from phoenix-core/src/security.ts"

# lib + cdylib + staticlib: the cdylib is the FFI surface for Node hosts and the Wasm
# target for the Workers host; the staticlib is what a Go cgo host would link. A host
# that cannot load any of these simply keeps using the TypeScript implementation — the
# port is optional by construction.
[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
regex = "1.11"
once_cell = "1.21"

[dev-dependencies]
serde_json = "1.0"