name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workers:
    name: TypeScript · typecheck · tests · bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # upm requires Node 22.3+ (docs/adr/ADR-0004-toolchain-upm.md).
          node-version: 22
      - run: npm i -g upm --min-release-age 0
      # upm's shared store is ~/.upm/store; caching it is what makes a repeat install
      # cheap. `node_modules` is not cached: upm links it from the store with hardlinks,
      # and a cached link tree is a second thing that can disagree with `upm.lock`.
      - name: Cache the upm store
        uses: actions/cache@v4
        with:
          path: ~/.upm/store
          key: upm-${{ runner.os }}-${{ hashFiles('upm.lock') }}
      # `--frozen-lockfile` fails if upm.lock is missing or stale. It never selects a
      # version, so a CI build cannot silently drift onto a newer dependency.
      - run: upm install --frozen-lockfile
      - name: Typecheck (TypeScript 7 / tsgo)
        run: npm run typecheck
      # `npm test` runs both suites in order: test:workers (vitest run, workerd pool)
      # then test:node (vitest run --config vitest.node.config.ts, plain Node).
      # Both suites are covered by the single `npm test` invocation; no separate
      # step is needed. See package.json scripts for the split.
      - name: Tests (vitest, workerd pool)
        run: npm test
      - name: Bundle check (wrangler dry-run)
        run: upx wrangler deploy --dry-run --outdir dist

  go:
    name: Go · build · vet · tests
    runs-on: ubuntu-latest
    env:
      # The workspace has no vendor directory, and -mod=vendor would make every
      # command fail with a misleading "inconsistent vendoring" error.
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.work.sum
      - name: Build the whole workspace
        run: go build all
      # `./packages/...` is NOT a valid pattern at the workspace root: the root is not
      # in any module, so Go answers "directory prefix packages does not contain modules
      # listed in go.work". The module-path pattern is workspace-aware and is the one
      # that actually runs the tests.
      - name: Vet
        run: go vet github.com/shaiinarab/simorgh/...
      - name: Test (`go test all` would also run the stdlib's and dependencies' tests)
        run: go test github.com/shaiinarab/simorgh/...

  security:
    name: Security · secrets scan · dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-node is still required: the scratch audit shells out to npm. No `cache: npm`
      # and no install step, because there is no package-lock.json to cache and this job
      # does not install the project.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `scripts/security-scan.sh` resolves its own throwaway
      # tree from package.json to audit it, because upm does not proxy `npm audit` and
      # npm cannot read `upm.lock`. That is why this job needs no package-manager step at
      # all -- and why the gate still works with no `package-lock.json` in the repository.
      #
      # Deliberately the SAME script a developer runs locally (`npm run security:scan`), so
      # the gate is not something that only exists in CI. Zero dependencies, no licence, no
      # SaaS account.
      - name: Secrets scan + dependency audit
        run: bash scripts/security-scan.sh
